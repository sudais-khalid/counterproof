[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "counterproof"
version = "0.1.0.dev0"
description = "Local-first verification agent: is an AI-written change actually proven by its tests?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Muhammad Sudais Khalid" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "libcst>=1.5",
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
counterproof = "counterproof.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/counterproof"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Fixture repositories are deliberately flawed test subjects, not our code.
extend-exclude = ["tests/fixtures/repos"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "C4", "PL"]
ignore = [
    "PLR0911", # rule tables and classifiers read best as early returns
    "PLR0912", # parsers and rule tables are branchy by nature
    "PLR0913", # CLI commands legitimately take many options
    "PLR2004", # magic values are fine in tests and thresholds live in config
    "S603",    # subprocess calls are deliberate and never use a shell
    "S607",    # git, node and test runners are resolved from PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"src/counterproof/cli.py" = ["PLR0917"]
"tests/unit/test_adapter_pytest.py" = ["E501"]  # verbatim junit XML samples
"tests/unit/test_integrity.py" = ["E501"]  # verbatim Python test-code samples  # Typer declares options as parameters

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["counterproof"]
exclude = ["tests/fixtures/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture repositories contain their own test suites; they are run inside git repos only.
norecursedirs = [".*", "build", "dist", "*.egg", "venv", "node_modules", "fixtures"]
markers = [
    "integration: exercises git and the CLI end to end",
]

[tool.coverage.run]
source = ["counterproof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
