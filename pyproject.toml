[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "counterproof"
version = "1.0.1"
description = "Proof, not green checkmarks: verify that an AI-written code change is actually proven by its tests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sudais Khalid" }]
keywords = [
    "ai-code-review",
    "ai-coding-agent",
    "claude-code",
    "mutation-testing",
    "test-quality",
    "reward-hacking",
    "verification",
    "pytest",
    "vitest",
    "jest",
    "ci",
    "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.40",
    "jinja2>=3.1",
    "libcst>=1.5",
    "mcp>=2.3,<3",
    "openai>=1.50",
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "tree-sitter>=0.25,<0.26",  # 0.26.0 segfaults reading node positions in large trees
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://sudais-khalid.github.io/counterproof/"
Documentation = "https://sudais-khalid.github.io/counterproof/"
Repository = "https://github.com/sudais-khalid/counterproof"
Issues = "https://github.com/sudais-khalid/counterproof/issues"
Changelog = "https://github.com/sudais-khalid/counterproof/blob/main/CHANGELOG.md"

[project.scripts]
counterproof = "counterproof.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/counterproof"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Fixture repositories are deliberately flawed test subjects, not our code.
extend-exclude = ["tests/fixtures/repos"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "C4", "PL"]
ignore = [
    "PLR0911", # rule tables and classifiers read best as early returns
    "PLR0912", # parsers and rule tables are branchy by nature
    "PLR0913", # CLI commands legitimately take many options
    "PLR2004", # magic values are fine in tests and thresholds live in config
    "S603",    # subprocess calls are deliberate and never use a shell
    "S607",    # git, node and test runners are resolved from PATH by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"src/counterproof/cli.py" = ["PLR0917"]
"tests/unit/test_adapter_pytest.py" = ["E501"]  # verbatim junit XML samples
"tests/unit/test_integrity.py" = ["E501"]  # verbatim Python test-code samples
"tests/unit/test_llm_mutants.py" = ["E501", "PLR0917"]  # verbatim samples, row builder  # Typer declares options as parameters
"tests/unit/test_tsast.py" = ["E501"]  # verbatim TypeScript samples
"tests/golden/c1_tasks_*.py" = ["E501"]  # verbatim fixture source and test code
"src/counterproof/eval/table.py" = ["E501"]  # Markdown table templates
"tests/unit/test_adapter_node.py" = ["E501"]  # verbatim Node error messages

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["counterproof"]
exclude = ["tests/fixtures/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture repositories contain their own test suites; they are run inside git repos only.
norecursedirs = [".*", "build", "dist", "*.egg", "venv", "node_modules", "fixtures"]
markers = [
    "integration: exercises git and the CLI end to end",
    "corpus: extended C1 tier (tasks T6 to T20); run by the corpus CI job",
]

[tool.coverage.run]
source = ["counterproof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
