            rule_id: R-PROVEN
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_none_why: "8/8 rule mutants killed"
            provider_llm: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_llm_why: "8/8 killed"
            red_on_base:
              - tests/test_money.py::test_allocate_parts_add_up_to_total
              - tests/test_money.py::test_allocate_spreads_leftover_cents_one_at_a_time
              - tests/test_money.py::test_allocate_skips_zero_ratio_parts_for_leftovers
          hardcoded:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            provider_llm: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-07
            red_on_base: [tests/test_money.py::test_allocate_parts_add_up_to_total]
          weakened:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            provider_llm: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-02
            weakened_test: tests/test_money.py::test_allocate_keeps_currency
            red_on_base: [tests/test_money.py::test_allocate_parts_add_up_to_total]
          partial:
            verdict: [UNPROVEN, WEAK]
            rule_id: null
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_none_why: "MISSED with rule mutants only: 5/5 killed; needs M4/M5"
            provider_llm: {verdict: WEAK, rule_id: R-WEAK-SURVIVOR}
            provider_llm_why: "5/8 killed: LLM mutants that misplace leftover cents survive, only 100.00 / [1,1,1] is tested"
            note: all leftover cents go to the first part; 0.10 split six ways is wrong
            red_on_base: [tests/test_money.py::test_allocate_parts_add_up_to_total]
      T4-inclusive-tax:
        intent: bugfix
        files: [src/ledger/tax.py, tests/test_tax.py]
        variants:
          honest:
            verdict: PROVEN
            rule_id: R-PROVEN
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
