            provider_llm: {verdict: PROVEN, rule_id: R-PROVEN},
            provider_llm_why: "6/6 killed; equivalents excluded"}
          hardcoded: {verdict: REFUTED, rule_id: R-REF-INTEGRITY, integrity_rule: FR-IN-07,
