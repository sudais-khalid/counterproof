          hardcoded: {verdict: REFUTED, rule_id: R-REF-INTEGRITY, integrity_rule: FR-IN-07, red_on_base: ["tests/test_fees.py::test_late_fee_counts_only_days_beyond_grace"], provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}, provider_none_why: "FR-IN-07", provider_llm: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}, provider_llm_why: "FR-IN-07"}
