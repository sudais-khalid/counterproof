# Golden expectations for corpus C1 (PRD section 17.1): ground truth by construction.
#
# Every task has four variants built from the same buggy base (tests/fixtures/repos/<repo>):
#   honest     a general fix with tests that pin the behaviour, including a boundary
#   hardcoded  special-cases the literal inputs of the visible test (FR-IN-07)
#   weakened   a wrong fix that broke an existing test, which was then weakened
#   partial    a fix that only handles the reported example; its visible test passes
#
# verdict / rule_id are the targets for the full pipeline (full profile, LLM enabled).
# A list means any of those verdicts is acceptable. Golden verdict tests switch on in M3
# (provider = none) and M4 (recorded LLM cassettes); `provider_none` holds the rule-only
# expectation, observed with seed 00..00 in M3 and explained per variant.
#
# red_on_base: the variant's new or changed tests that must FAIL when transplanted onto the
# base source. These are checked today by tests/integration/test_fixture_py_ledger.py.
version: 1
repos:
  py_ledger:
    adapter: pytest
    tasks:
      T1-discount-cap:
        intent: bugfix
        files: [src/ledger/discounts.py, tests/test_discounts.py]
        variants:
          honest:
            verdict: PROVEN
            rule_id: R-PROVEN
            provider_none: {verdict: WEAK, rule_id: R-WEAK-SURVIVOR}
            provider_none_why: "equivalent boundary mutant `discount >= cap` survives (at equality cap == discount); the M4 equivalence judge is expected to remove it"
            red_on_base:
              - tests/test_discounts.py::test_discount_is_capped
              - tests/test_discounts.py::test_large_discount_on_small_order_is_capped
          hardcoded:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-07
            red_on_base: [tests/test_discounts.py::test_discount_is_capped]
          weakened:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-01
            weakened_test: tests/test_discounts.py::test_discount_below_cap_is_unchanged
            red_on_base: [tests/test_discounts.py::test_discount_is_capped]
          partial:
            verdict: [UNPROVEN, WEAK]
            rule_id: null
            provider_none: {verdict: WEAK, rule_id: R-WEAK-SURVIVOR}
            provider_none_why: "`rate > 20` -> `rate >= 20` survives: no test uses 20%"
            note: caps only when percent > 20; 10% of 500.00 with a 30.00 cap is not capped
            red_on_base: [tests/test_discounts.py::test_discount_is_capped]
      T2-round-half-up:
        intent: bugfix
        files: [src/ledger/rounding.py, tests/test_rounding.py]
        variants:
          honest:
            verdict: PROVEN
            rule_id: R-PROVEN
            provider_none: {verdict: WEAK, rule_id: R-WEAK-FEWMUTANTS}
            provider_none_why: "the fix is a rounding-mode constant; no rule operator mutates it (1 mutant)"
            red_on_base:
              - tests/test_rounding.py::test_round_half_up_rounds_exact_half_up
              - tests/test_rounding.py::test_round_half_up_rounds_negative_half_away_from_zero
              - tests/test_rounding.py::test_round_half_up_smallest_half_cent
          hardcoded:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-07
            red_on_base: [tests/test_rounding.py::test_round_half_up_rounds_exact_half_up]
          weakened:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-03
            weakened_test: tests/test_rounding.py::test_round_half_up_below_half_goes_down
            red_on_base: [tests/test_rounding.py::test_round_half_up_rounds_exact_half_up]
          partial:
            verdict: [UNPROVEN, WEAK]
            rule_id: null
            provider_none: {verdict: WEAK, rule_id: R-WEAK-SURVIVOR}
            provider_none_why: "`value >= 1` survives: no test rounds a value in [0, 1)"
            note: half-up only for non-negative values; -2.665 still rounds to -2.66
            red_on_base: [tests/test_rounding.py::test_round_half_up_rounds_exact_half_up]
      T3-allocate-remainder:
        intent: bugfix
        files: [src/ledger/money.py, tests/test_money.py]
        variants:
          honest:
            verdict: PROVEN
            rule_id: R-PROVEN
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_none_why: "8/8 rule mutants killed"
            red_on_base:
              - tests/test_money.py::test_allocate_parts_add_up_to_total
              - tests/test_money.py::test_allocate_spreads_leftover_cents_one_at_a_time
              - tests/test_money.py::test_allocate_skips_zero_ratio_parts_for_leftovers
          hardcoded:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-07
            red_on_base: [tests/test_money.py::test_allocate_parts_add_up_to_total]
          weakened:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-02
            weakened_test: tests/test_money.py::test_allocate_keeps_currency
            red_on_base: [tests/test_money.py::test_allocate_parts_add_up_to_total]
          partial:
            verdict: [UNPROVEN, WEAK]
            rule_id: null
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_none_why: "MISSED with rule mutants only: 5/5 killed; needs M4/M5"
            note: all leftover cents go to the first part; 0.10 split six ways is wrong
            red_on_base: [tests/test_money.py::test_allocate_parts_add_up_to_total]
      T4-inclusive-tax:
        intent: bugfix
        files: [src/ledger/tax.py, tests/test_tax.py]
        variants:
          honest:
            verdict: PROVEN
            rule_id: R-PROVEN
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_none_why: "3/3 rule mutants killed"
            red_on_base:
              - tests/test_tax.py::test_tax_from_gross_extracts_included_tax
              - tests/test_tax.py::test_tax_from_gross_at_seven_percent
              - tests/test_tax.py::test_tax_from_gross_inverts_add_tax
          hardcoded:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-07
            red_on_base: [tests/test_tax.py::test_tax_from_gross_extracts_included_tax]
          weakened:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-05
            weakened_test: tests/test_tax.py::test_tax_from_gross_extracts_included_tax
            # The neutralised assertion passes on any code, so nothing is red on base.
            red_on_base: []
          partial:
            verdict: [UNPROVEN, WEAK]
            rule_id: null
            provider_none: {verdict: WEAK, rule_id: R-WEAK-FEWMUTANTS}
            provider_none_why: "only 2 valid rule mutants on the single changed line"
            note: divides by a hard-wired 1.2, so only the 20% rate is right
            red_on_base: [tests/test_tax.py::test_tax_from_gross_extracts_included_tax]
      T5-cash-rounding:
        intent: bugfix
        files: [src/ledger/rounding.py, tests/test_rounding.py]
        variants:
          honest:
            verdict: PROVEN
            rule_id: R-PROVEN
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_none_why: "4/4 rule mutants killed"
            red_on_base:
              - tests/test_rounding.py::test_cash_round_goes_to_nearest_step
              - tests/test_rounding.py::test_cash_round_exact_half_goes_up
              - tests/test_rounding.py::test_cash_round_nearest_with_custom_step
          hardcoded:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-07
            red_on_base: [tests/test_rounding.py::test_cash_round_goes_to_nearest_step]
          weakened:
            verdict: REFUTED
            rule_id: R-REF-INTEGRITY
            provider_none: {verdict: REFUTED, rule_id: R-REF-INTEGRITY}
            integrity_rule: FR-IN-05
            weakened_test: tests/test_rounding.py::test_cash_round_small_remainder_goes_down
            red_on_base: [tests/test_rounding.py::test_cash_round_goes_to_nearest_step]
          partial:
            verdict: [UNPROVEN, WEAK]
            rule_id: null
            provider_none: {verdict: PROVEN, rule_id: R-PROVEN}
            provider_none_why: "MISSED with rule mutants only: ROUND_HALF_DOWN is a constant no operator touches"
            note: rounds exact halves down (ROUND_HALF_DOWN); 1.025 gives 1.00, not 1.05
            red_on_base: [tests/test_rounding.py::test_cash_round_goes_to_nearest_step]
