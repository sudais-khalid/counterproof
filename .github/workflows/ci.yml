name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: uv sync --locked
      - name: Install fixture test runners (Vitest, Jest; pinned by package-lock.json)
        run: npm ci --no-audit --no-fund --prefix tests/fixtures/node
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q -n auto -m "not corpus" --cov --cov-report=term
        env:
          COUNTERPROOF_REQUIRE_NODE: "1" # Node-based tests must run here, never skip
          # Ubuntu runners have a docker daemon: the --sandbox docker tests must run there.
          COUNTERPROOF_REQUIRE_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - name: Doctor
        run: uv run counterproof doctor

  corpus:
    # The extended C1 tier (tasks T6 to T20 of both fixtures, 120 variants): fixture checks
    # and golden verdicts, rule-only and with recorded LLM answers. One OS keeps CI fast;
    # the matrix above runs the same code paths on the original ten tasks everywhere.
    name: corpus (extended C1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: uv sync --locked
      - name: Install fixture test runners
        run: npm ci --no-audit --no-fund --prefix tests/fixtures/node
      - name: Corpus tests
        run: uv run pytest -q -n auto -m corpus
        env:
          COUNTERPROOF_REQUIRE_NODE: "1"

  action:
    # The GitHub Action end to end, as a user runs it: a real git repository holding the
    # seeded hard-coded fix (py_ledger T1), a separate test interpreter, and the gate.
    name: GitHub Action (end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build the fixture pull request and its test environment
        run: |
          uv sync --locked
          uv run python scripts/action_fixture.py "$RUNNER_TEMP/fixture" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/testenv"
          "$RUNNER_TEMP/testenv/bin/pip" install --quiet pytest pytest-cov
      - id: counterproof
        uses: ./action
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/fixture
          base: ${{ env.FIXTURE_BASE }}
          head: ${{ env.FIXTURE_HEAD }}
          test-python: ${{ runner.temp }}/testenv/bin/python
          comment: "false"
          upload-sarif: "false"
      - name: The hard-coded fix is refuted and the gate fails the job
        env:
          VERDICT: ${{ steps.counterproof.outputs.verdict }}
          OUTCOME: ${{ steps.counterproof.outcome }}
        run: |
          echo "verdict=$VERDICT outcome=$OUTCOME"
          test "$VERDICT" = REFUTED
          test "$OUTCOME" = failure
