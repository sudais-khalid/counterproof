name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: uv sync --locked
      - name: Install fixture test runners (Vitest, Jest; pinned by package-lock.json)
        run: npm ci --no-audit --no-fund --prefix tests/fixtures/node
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q -n auto --cov --cov-report=term
        env:
          COUNTERPROOF_REQUIRE_NODE: "1" # Node-based tests must run here, never skip
      - name: Doctor
        run: uv run counterproof doctor
